name: GeneRev4 REAL - local bridge tests
on:
  push:
    branches: [main]
    paths:
      - 'real/**'
      - '.github/workflows/real-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test TCP protocol and safety interlocks
        run: python -m unittest discover -s real/tests -v
      - name: Python syntax
        run: python -m compileall -q real/bridge.py
      - name: Browser syntax
        run: node --check real/static/app.js
