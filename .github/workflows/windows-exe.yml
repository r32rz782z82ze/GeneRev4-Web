name: GeneRev4 Windows - EXE build
on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'real/bridge.py'
      - '.github/workflows/windows-exe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build portable Windows application (no self-extraction)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Verify Nico protocol, safety checks and Windows profiles
        shell: pwsh
        run: |
          python -m unittest discover -s real/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s windows/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q real/bridge.py windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHONPATH = (Resolve-Path 'real').Path
          python windows/GeneRev4_Windows.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install PyInstaller
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build multi-file portable app (avoids _decimal.pyd onefile extraction)
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onedir --noupx --windowed --contents-directory _internal --name GeneRev4_Windows --paths real --paths windows windows/GeneRev4_Windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = "dist/GeneRev4_Windows"
          if (!(Test-Path "$app/GeneRev4_Windows.exe")) { throw "GeneRev4_Windows.exe missing" }
          $decimal = Get-ChildItem -Path $app -Filter '_decimal.pyd' -Recurse -File
          if (!$decimal) { throw "Python decimal extension missing from portable distribution" }
          Write-Host "Embedded Python native decimal extensions:"
          $decimal | ForEach-Object { Write-Host $_.FullName }
      - name: Test compiled Windows EXE without roaster hardware
        shell: pwsh
        run: |
          $app = (Resolve-Path "dist/GeneRev4_Windows/GeneRev4_Windows.exe").Path
          $p = Start-Process -FilePath $app -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Windows portable EXE self-test failed: $($p.ExitCode)" }
      - name: Add instructions and SHA256 manifest
        shell: pwsh
        run: |
          $app = "dist/GeneRev4_Windows"
          Copy-Item "windows/README.md" "$app/OLVASD_EL_GeneRev4_Windows.md"
          "GeneRev4 Windows portable build - SHA256" | Set-Content "$app/SHA256.txt" -Encoding utf8
          Get-ChildItem "$app" -File -Recurse | Where-Object { $_.Name -ne "SHA256.txt" } | ForEach-Object {
            $hash = Get-FileHash -Path $_.FullName -Algorithm SHA256
            $relative = $_.FullName.Substring((Resolve-Path $app).Path.Length + 1)
            "$($hash.Hash)  $relative" | Add-Content "$app/SHA256.txt" -Encoding utf8
          }
          $total = (Get-ChildItem $app -File -Recurse | Measure-Object Length -Sum).Sum
          Write-Host "Portable application bytes: $total"
      - name: Upload complete Windows portable folder
        uses: actions/upload-artifact@v4
        with:
          name: GeneRev4-Windows-Portable-ONEDIR
          path: dist/GeneRev4_Windows/
          retention-days: 30
          if-no-files-found: error
